[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "national-park-visitation-toolkit"
version = "0.1.0"
description = "Toolkit to retrieve, clean, validate, and analyze official U.S. National Park Service visitor use statistics."
readme = "README.md"
authors = [
  { name = "jayasimha-reddy-code", email = "thavvar09@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "pandas>=2.1,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
analysis = [
  "matplotlib>=3.8",
  "nbconvert>=7.0",
  "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["organizer*", "scraper*"]
